<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games Unblocked</title>
    <style>
        /* Clean Human-Made Minimalist Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* requested title heading */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Fixed working search bar layout */
        .search-box {
            width: 100%;
            max-width: 450px;
            padding: 12px 20px;
            background-color: #1f2833;
            border: 1px solid #45f3ff;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        /* Clean Modern Games Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: #1f2833;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #2f3e46;
            transition: transform 0.2s ease, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #45f3ff;
        }

        .card-banner {
            height: 130px;
            background-color: #0b0c10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            font-size: 1.15rem;
            margin-bottom: 5px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #95a5a6;
            line-height: 1.4;
        }

        /* Snappy, Smooth Slide-Up Popup Container */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-window {
            width: 95%;
            max-width: 1100px;
            height: 85vh;
            background-color: #1f2833;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .popup-overlay.show .popup-window {
            transform: translateY(0);
        }

        /* Popup Top Navigation Row */
        .popup-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f3e46;
        }

        /* Custom ✕ Close Button */
        .close-x {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .close-x:hover {
            transform: scale(1.2);
        }

        .game-wrapper {
            flex: 1;
            background-color: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Search utility hidden flag */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Retro Games unblocked</h1>
        <!-- Working Live Filter Search Bar -->
        <input type="text" id="gameSearch" class="search-box" placeholder="Type a game name...">
    </header>

    <div class="grid">
        
        <!-- Game 1 -->
        <div class="card" onclick="openGame('Baldi\'s Basics', 'https://itch.io')">
            <div class="card-banner">📐</div>
            <div class="card-info">
                <h2 class="card-title">Baldi's Basics</h2>
                <p class="card-desc">Find all 7 notebooks and try to escape the school classroom.</p>
            </div>
        </div>

        <!-- Game 2 -->
        <div class="card" onclick="openGame('Slope 3D', 'https://github.io')">
            <div class="card-banner">🟢</div>
            <div class="card-info">
                <h2 class="card-title">Slope 3D</h2>
                <p class="card-desc">Keep rolling down the high-speed pathway. Don't touch the red blocks.</p>
            </div>
        </div>

        <!-- Game 3 -->
        <div class="card" onclick="openGame('1v1.LOL', 'https://1v1.lol')">
            <div class="card-banner">🔫</div>
            <div class="card-info">
                <h2 class="card-title">1v1.LOL</h2>
                <p class="card-desc">Build defensive layouts and practice tracking target mechanics.</p>
            </div>
        </div>

    </div>

    <!-- Slide-Up Game Player Panel Pop-up -->
    <div class="popup-overlay" id="playerOverlay">
        <div class="popup-window">
            <div class="popup-header">
                <h2 id="popupTitle">Loading Engine...</h2>
                <!-- The Core ✕ Exit Button -->
                <button class="close-x" onclick="closeGame()">✕</button>
            </div>
            <div class="game-wrapper">
                <iframe id="gameIframe" src="" allow="autoplay; fullscreen;"></iframe>
            </div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('playerOverlay');
        const iframe = document.getElementById('gameIframe');
        const title = document.getElementById('popupTitle');
        const searchInput = document.getElementById('gameSearch');
        const cards = document.querySelectorAll('.card');

        // Fixed instant text matching filter search loop
        searchInput.addEventListener('input', () => {
            const val = searchInput.value.toLowerCase().trim();
            
            cards.forEach(card => {
                const headerText = card.querySelector('.card-title').textContent.toLowerCase();
                if (headerText.includes(val)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });

        // Launch app iframe container directly into local viewport
        function openGame(name, link) {
            title.textContent = name;
            iframe.src = link;
            overlay.classList.add('show');
        }

        // Clean termination sequence to stop background frame music processes
        function closeGame() {
            overlay.classList.remove('show');
            setTimeout(() => {
                iframe.src = "";
            }, 300);
        }
    </script>

</body>
</html>
