<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games Unblocked</title>
    <style>
        /* Modern Premium Dark Workspace Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030306;
            background-image: 
                radial-gradient(at 0% 0%, rgba(69, 243, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(192, 132, 252, 0.08) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Spring Velocity Bounce Mechanics for UI Buttons */
        .btn-velocity, .card, .slide-btn {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .btn-velocity:hover, .slide-btn:hover {
            transform: scale(1.12);
        }
        .btn-velocity:active, .slide-btn:active {
            transform: scale(0.95);
        }

        /* Sleek Glass Search Bar */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .search-box {
            width: 100%;
            max-width: 480px;
            padding: 14px 24px;
            background-color: rgba(22, 22, 29, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box:focus {
            border-color: rgba(69, 243, 255, 0.4);
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.1);
        }

        /* Premium Glass Banner Slider */
        .slider-container {
            position: relative;
            max-width: 1000px;
            height: 240px;
            margin: 40px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(17, 17, 24, 0.4);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide {
            width: 33.333%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(10, 10, 15, 0.8);
        }

        .slide h2 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
        .slide p { font-size: 0.95rem; color: #9ca3af; max-width: 550px; line-height: 1.5; }

        .slide-btn {
            position: absolute;
            top: 50%;
            background-color: rgba(22, 22, 29, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-prev { left: 20px; transform: translateY(-50%); }
        .slide-next { right: 20px; transform: translateY(-50%); }
        .slide-prev:hover { transform: translateY(-50%) scale(1.12); border-color: rgba(255,255,255,0.2); }
        .slide-next:hover { transform: translateY(-50%) scale(1.12); border-color: rgba(255,255,255,0.2); }

        /* Flexible Grid Framework (Fixes Broken Layout Constraints) */
        .grid-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        /* Glassmorphic Game Card Modules */
        .card {
            background-color: rgba(22, 22, 29, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            width: calc(33.333% - 20px);
            min-width: 280px;
            flex-grow: 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(69, 243, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(69, 243, 255, 0.05);
        }

        .card-banner {
            height: 140px;
            background-color: rgba(10, 10, 15, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .card-info { padding: 24px; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
        .card-desc { font-size: 0.9rem; color: #9ca3af; line-height: 1.5; }

        /* Dead-Centered Modal View Shell */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 3, 6, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Expanding Pop-up Card Hulls */
        .popup-window {
            width: 90%;
            max-width: 1100px;
            height: 82vh;
            background-color: #0b0c11;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .popup-overlay.show .popup-window {
            transform: scale(1);
        }

        .popup-header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background-color: #101117;
        }

        .popup-header h2 { font-size: 1.2rem; font-weight: 700; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Action Buttons Styling */
        .fullscreen-btn {
            background-color: rgba(255,255,255,0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .fullscreen-btn:hover {
            border-color: rgba(69, 243, 255, 0.4);
            background-color: rgba(69, 243, 255, 0.05);
        }

        .close-x {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.7rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-wrapper {
            flex: 1;
            background-color: #000000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Clean Search Utility (Prevents broken layout gaps) */
        .card.hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>Retro Games unblocked</h1>
        <div class="search-container">
            <input type="text" id="gameSearch" class="search-box" placeholder="Search unblocked directories...">
        </div>
    </header>

    <!-- Premium Glass Banner Slider -->
    <div class="slider-container">
        <button class="slide-btn slide-prev" onclick="moveSlider(-1)">❮</button>
        <button class="slide-btn slide-next" onclick="moveSlider(1)">❯</button>
        <div class="slider-track" id="sliderTrack">
            <div class="slide" style="background-image: linear-gradient(rgba(3,3,6,0.75), rgba(3,3,6,0.75)), url('https://unsplash.com');">
                <h2>Featured: Baldi's Basics</h2>
                <p>Test your problem-solving capabilities under severe classroom pressure parameters.</p>
            </div>
