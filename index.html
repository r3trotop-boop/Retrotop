<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games Unblocked</title>
    <style>
        /* Modern Premium Minimalist Layout Theme - LOCKED IN UI STYLE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050508;
            background-image: 
                radial-gradient(at 0% 0%, rgba(69, 243, 255, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(192, 132, 252, 0.06) 0px, transparent 50%);
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Main window is fixed, only specific panels scroll */
        }

        header {
            text-align: center;
            padding: 30px 20px 15px 20px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Spring Velocity Bounce Mechanics */
        .btn-velocity, .card, .menu-item {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, border-color 0.2s;
        }
        .btn-velocity:hover, .menu-item:hover {
            transform: scale(1.08);
        }
        .card:hover {
            transform: scale(1.03);
        }
        .btn-velocity:active, .card:active, .menu-item:active {
            transform: scale(0.96);
        }

        /* Sleek Search Interface Wrapper */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .search-box {
            width: 100%;
            max-width: 480px;
            padding: 12px 20px;
            background-color: #111116;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box:focus {
            border-color: rgba(69, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.1);
        }

        /* Main Workspace Splitting Layout Frame */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 20px;
            gap: 25px;
        }

        /* FIXED SIDEBAR CATEGORY MENU */
        .sidebar {
            width: 220px;
            background-color: rgba(17, 17, 22, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            overflow-y: auto; /* Handles category overflow scrolling smoothly */
        }

        .menu-item {
            width: 100%;
            padding: 12px 16px;
            background-color: transparent;
            border: 1px solid transparent;
            color: #9ca3af;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }
        .menu-item.active, .menu-item:hover {
            background-color: #111116;
            border-color: rgba(69, 243, 255, 0.2);
            color: #ffffff;
        }

        /* DYNAMIC SCROLL CONTAINER FRAMEWORK (REQUESTED FEATURE) */
        .grid-container {
            flex: 1;
            overflow-y: scroll; /* Enables smooth, independent catalog layout scrolling */
            padding-right: 8px;
            scroll-behavior: smooth;
        }

        /* Sleek Modern Custom Scrollbar UI Elements */
        .grid-container::-webkit-scrollbar, .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .grid-container::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .grid-container::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .grid-container::-webkit-scrollbar-thumb:hover, .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(69, 243, 255, 0.3);
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            padding-bottom: 40px;
        }

        /* Premium Tech Card Styling */
        .card {
            background-color: #111116;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            width: calc(33.333% - 14px); /* Clean uniform desktop rows */
            min-width: 250px;
            flex-grow: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        /* Screen sizing logic scales card columns cleanly */
        @media (max-width: 1024px) { .card { width: calc(50% - 10px); } }
        @media (max-width: 700px) { .card { width: 100%; } }

        .card:hover {
            border-color: rgba(69, 243, 255, 0.4);
            box-shadow: 0 15px 30px rgba(69, 243, 255, 0.05);
        }

        .card-image-box {
            width: 100%;
            height: 130px;
            background-size: cover;
            background-position: center;
            background-color: #161622;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-info { 
            padding: 16px; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
        .card-desc { font-size: 0.82rem; color: #9ca3af; line-height: 1.4; margin-bottom: 12px; flex-grow: 1; }

        /* The Like and Dislike Rating System Layout */
        .rating-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 10px;
            margin-top: auto;
        }

        .rating-btn {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #a1a1aa;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rating-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }
        .like-btn:hover, .like-btn.voted {
            border-color: rgba(74, 222, 128, 0.4);
            color: #4ade80 !important;
            background-color: rgba(74, 222, 128, 0.05);
        }
        .dislike-btn:hover, .dislike-btn.voted {
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444 !important;
            background-color: rgba(239, 68, 68, 0.05);
        }

        /* PURE PRE-HARDCODED FRAMEWORK OVERLAY MODULE */
        #fixedOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(3, 3, 5, 0.95);
            backdrop-filter: blur(12px);
            z-index: 999999;
            display: none !important; 
            justify-content: center;
            align-items: center;
        }

        #fixedWindow {
            width: 92%;
            max-width: 1150px;
            height: 85vh;
            background-color: #0b0c11;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        #fixedHeader {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background-color: #101117;
        }

        #fixedHeader h2 { font-size: 1.15rem; font-weight: 700; color: white; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .fullscreen-btn {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .close-x {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fixedGameWrapper {
            flex: 1;
            background-color: #000000;
        }

        #fixedIframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Retro Games unblocked</h1>
        <div class="search-container">
            <input type="text" id="gameSearch" class="search-box" placeholder="Search games catalog...">
        </div>
    </header>

    <div class="app-body">
        <!-- FIXED NAVIGATION BAR CATEGORIES -->
