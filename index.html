<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games Unblocked</title>
    <style>
        /* Modern Premium Minimalist Layout Theme - LOCKED IN UI STYLE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050508;
            background-image: 
                radial-gradient(at 0% 0%, rgba(69, 243, 255, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(192, 132, 252, 0.06) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Spring Velocity Bounce Mechanics */
        .btn-velocity, .card {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, border-color 0.2s;
        }
        .btn-velocity:hover {
            transform: scale(1.1);
        }
        .card:hover {
            transform: scale(1.04);
        }
        .btn-velocity:active, .card:active {
            transform: scale(0.96);
        }

        /* Sleek Search Interface Wrapper */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .search-box {
            width: 100%;
            max-width: 480px;
            padding: 14px 24px;
            background-color: #111116;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box:focus {
            border-color: rgba(69, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.1);
        }

        /* Flexible Grid System Framework */
        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        /* Premium Tech Card Styling with Dynamic Image Integration */
        .card {
            background-color: #111116;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            width: calc(33.333% - 20px);
            min-width: 260px;
            flex-grow: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: rgba(69, 243, 255, 0.4);
            box-shadow: 0 15px 30px rgba(69, 243, 255, 0.05);
        }

        /* HIGH RESOLUTION GAME PICTURE SLOTS */
        .card-image-box {
            width: 100%;
            height: 150px;
            background-size: cover;
            background-position: center;
            background-color: #161622;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-info { 
            padding: 18px; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
        .card-desc { font-size: 0.85rem; color: #9ca3af; line-height: 1.4; margin-bottom: 14px; flex-grow: 1; }

        /* THE LIKE AND DISLIKE RATING SYSTEM LAYOUT */
        .rating-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 12px;
            margin-top: auto;
        }

        .rating-btn {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #a1a1aa;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .rating-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }
        .like-btn:hover, .like-btn.voted {
            border-color: rgba(74, 222, 128, 0.4);
            color: #4ade80 !important;
            background-color: rgba(74, 222, 128, 0.05);
        }
        .dislike-btn:hover, .dislike-btn.voted {
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444 !important;
            background-color: rgba(239, 68, 68, 0.05);
        }

        /* HARDCODED POPUP STYLING LAYER - STOPS ACCIDENTAL RENDERING BLOCKS */
        #fixedOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(3, 3, 5, 0.95);
            backdrop-filter: blur(12px);
            z-index: 999999;
            display: none !important; /* Forced active display properties run via code links */
            justify-content: center;
            align-items: center;
        }

        #fixedWindow {
            width: 92%;
            max-width: 1150px;
            height: 85vh;
            background-color: #0b0c11;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        #fixedHeader {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background-color: #101117;
        }

        #fixedHeader h2 { font-size: 1.15rem; font-weight: 700; color: white; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .fullscreen-btn {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .close-x {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fixedGameWrapper {
            flex: 1;
            background-color: #000000;
        }

        #fixedIframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .card.hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>Retro Games unblocked</h1>
        <div class="search-container">
            <input type="text" id="gameSearch" class="search-box" placeholder="Search games catalog...">
        </div>
    </header>

    <div class="grid-container">
        <div class="grid">
            
            <!-- Game 1: Eaglercraft -->
            <div class="card" data-id="retro_eaglercraft" onclick="openGame('Eaglercraft (Minecraft)', 'https://github.io')">
                <div class="card-image-box" style="background-image: url('https://unsplash.com');"></div>
                <div class="card-info">
                    <h2 class="card-title">Eaglercraft</h2>
                    <p class="card-desc">Full web-based multiplayer Minecraft clone. Explore, mine, and build blocks.</p>
                    <div class="rating-panel">
                        <button class="rating-btn like-btn" onclick="registerGlobalVote(event, 'retro_eaglercraft', 'like')">👍 <span class="count">0</span></button>
                        <button class="rating-btn dislike-btn" onclick="registerGlobalVote(event, 'retro_eaglercraft', 'dislike')">👎 <span class="count">0</span></button>
                    </div>
                </div>
            </div>

            <!-- Game 2: Red Ball 4 -->
            <div class="card" data-id="retro_redball4" onclick="openGame('Red Ball 4', 'https://github.io')">
                <div class="card-image-box" style="background-image: url('https://unsplash.com');"></div>
                <div class="card-info">
                    <h2 class="card-title">Red Ball 4</h2>
                    <p class="card-desc">Roll, jump, and bounce through dangerous obstacles to defeat the evil squares.</p>
                    <div class="rating-panel">
                        <button class="rating-btn like-btn" onclick="registerGlobalVote(event, 'retro_redball4', 'like')">👍 <span class="count">0</span></button>
                        <button class="rating-btn dislike-btn" onclick="registerGlobalVote(event, 'retro_redball4', 'dislike')">👎 <span class="count">0</span></button>
                    </div>
                </div>
            </div>

            <!-- Game 3: Run 3 -->
