<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games Unblocked</title>
    <style>
        /* Modern Premium Minimalist Theme Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050508;
            background-image: 
                radial-gradient(at 0% 0%, rgba(69, 243, 255, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(192, 132, 252, 0.06) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 50px 20px;
            overflow-x: hidden;
            opacity: 0;
            animation: globalFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes globalFadeIn {
            to { opacity: 1; }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            transform: translateY(-15px);
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
        }

        @keyframes slideDown {
            to { transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Spring Velocity Elastic Bounce Mechanics */
        .btn-velocity, .card, .slide-btn {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, border-color 0.2s;
        }
        .btn-velocity:hover, .slide-btn:hover {
            transform: scale(1.1);
        }
        .btn-velocity:active, .slide-btn:active {
            transform: scale(0.96);
        }

        /* Sleek Search Interface Wrapper */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .search-box {
            width: 100%;
            max-width: 480px;
            padding: 14px 24px;
            background-color: #111116;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box:focus {
            border-color: rgba(69, 243, 255, 0.4);
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.05);
        }

        /* Premium Banner Slider Layout */
        .slider-container {
            position: relative;
            max-width: 1000px;
            height: 220px;
            margin: 40px auto;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #111116;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: translateY(20px);
            opacity: 0;
            animation: contentRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        @keyframes contentRise {
            to { transform: translateY(0); opacity: 1; }
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide {
            width: 33.333%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(10, 10, 15, 0.82);
        }

        .slide h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
        .slide p { font-size: 0.95rem; color: #9ca3af; max-width: 550px; line-height: 1.5; }

        .slide-btn {
            position: absolute;
            top: 50%;
            background-color: #16161f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-prev { left: 20px; transform: translateY(-50%); }
        .slide-next { right: 20px; transform: translateY(-50%); }
        .slide-prev:hover { transform: translateY(-50%) scale(1.1); }
        .slide-next:hover { transform: translateY(-50%) scale(1.1); }

        /* Flexible Grid System Framework */
        .grid-container {
            max-width: 1000px;
            margin: 0 auto;
            transform: translateY(20px);
            opacity: 0;
            animation: contentRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        /* High-End Tech Game Card Shells */
        .card {
            background-color: #111116;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            width: calc(33.333% - 20px);
            min-width: 280px;
            flex-grow: 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, border-color 0.2s, opacity 0.2s, scale 0.2s;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(69, 243, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Clean Visual Placeholder Boxes */
        .card-banner {
            height: 140px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .banner-baldi { background: linear-gradient(135deg, #132519 0%, #08100a 100%); color: #4ade80; }
        .banner-slope { background: linear-gradient(135deg, #141b2d 0%, #090c15 100%); color: #6366f1; }
        .banner-lol { background: linear-gradient(135deg, #241435 0%, #100819 100%); color: #a855f7; }

        /* Dead-Centered Popup Modal Container */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 3, 5, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-window {
            width: 90%;
            max-width: 1050px;
            height: 82vh;
            background-color: #0b0c11;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            transform: scale(0.88);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .popup-overlay.show .popup-window {
            transform: scale(1);
        }

        .popup-header {
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background-color: #101117;
        }

        .popup-header h2 { font-size: 1.15rem; font-weight: 700; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .fullscreen-btn {
            background-color: rgba(255,255,255,0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .fullscreen-btn:hover {
            border-color: rgba(69, 243, 255, 0.3);
            background-color: rgba(69, 243, 255, 0.02);
        }

        .close-x {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-wrapper {
            flex: 1;
            background-color: #000000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Smooth Hide Animation utility */
        .card.hidden { 
            opacity: 0;
            transform: scale(0.8) translateY(15px);
            pointer-events: none;
            position: absolute;
            width: 0;
            height: 0;
            padding: 0;
            margin: 0;
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <h1>Retro Games unblocked</h1>
        <div class="search-container">
            <input type="text" id="gameSearch" class="search-box" placeholder="Search unblocked directories...">
        </div>
    </header>
